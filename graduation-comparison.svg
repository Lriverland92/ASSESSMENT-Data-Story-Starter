
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="title desc">
    <title id="title">Graduation Rates in 2015 and 2024</title>
    <desc id="desc">Two bars compare six-year bachelor's degree graduation rates: 59.4 percent in 2015 and 64.8 percent in 2024, an increase of 5.4 percentage points.</desc>
  
    <rect width="800" height="450" fill="#ffffff"/>
  
    <g font-family="Arial, sans-serif" fill="#333333">
      <text x="400" y="48" font-size="25" font-weight="bold" text-anchor="middle">
        Graduation Rates: 2015 vs. 2024
      </text>
      <text x="400" y="78" font-size="16" text-anchor="middle">
        Six-year bachelor's degree completion
      </text>
    </g>
  
    <line x1="130" y1="350" x2="670" y2="350" stroke="#555555" stroke-width="2"/>
  
    <rect x="190" y="171.8" width="150" height="178.2" rx="6" fill="#8c1d40"/>
    <rect x="460" y="155.6" width="150" height="194.4" rx="6" fill="#b07800"/>
  
    <g font-family="Arial, sans-serif" text-anchor="middle">
      <text x="265" y="156" font-size="24" font-weight="bold" fill="#333333">59.4%</text>
      <text x="535" y="140" font-size="24" font-weight="bold" fill="#333333">64.8%</text>
  
      <text x="265" y="385" font-size="20" fill="#333333">2015</text>
      <text x="535" y="385" font-size="20" fill="#333333">2024</text>
  
      <text x="400" y="422" font-size="15" fill="#333333">
        Increase: 5.4 percentage points
      </text>
    </g>
  </svg>
  